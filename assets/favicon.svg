<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Fond rond avec dégradé tricolore -->
  <rect width="64" height="64" rx="16" fill="url(#favGrad)"/>
  
  <!-- Toque d'étudiant / chapeau de diplômé -->
  <g filter="url(#favShadow)" fill="#ffffff" transform="translate(6, 6) scale(0.82)">
    <!-- Losange supérieur -->
    <polygon points="32,8 60,21 32,34 4,21"/>
    <!-- Calotte sous le chapeau -->
    <path d="M 14 27 L 14 39 C 14 48, 50 48, 50 39 L 50 27 C 44 31, 38 33, 32 33 C 26 33, 20 31, 14 27 Z"/>
    <!-- Pompon et cordon -->
    <path d="M 54 23 L 56 36 L 52 36 Z" fill="#fef08a"/>
    <circle cx="54" cy="38" r="3" fill="#fef08a"/>
  </g>

  <!-- Badge 3e stylisé -->
  <rect x="22" y="44" width="38" height="17" rx="8.5" fill="#0f172a" opacity="0.92"/>
  <text x="41" y="56.5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="-0.5">3ème</text>
</svg>
